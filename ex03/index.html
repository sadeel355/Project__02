<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Color Palette</h1>

    <div class="palette">
        <div class="swatch named">Named Color</div>
        <div class="swatch hex">HEX</div>
        <div class="swatch rgb">RGB</div>
        <div class="swatch rgba">RGBA</div>
    </div>

    <h2>Opacity vs RGBA</h2>

    <div class="comparison">
        <div class="box opacity-box">
            <p>Opacity: 0.5</p>
        </div>

        <div class="box rgba-box">
            <p>RGBA: 0.5</p>
        </div>
    </div>

</body>
</html>
